name: Anmeldung

on:
  push:
    branches: [main]
  pull_request:

jobs:
  anmeldung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Images holen
        run: docker compose -f tests/integration/docker-compose.yml pull --quiet

      - run: npm run test:integration
        env:
          INTEGRATION_ZITADEL_KEEP: '1'

      - name: ZITADEL-Protokoll bei Fehlschlag
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --no-color --tail 200

      - name: Aufraeumen
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v
