name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # In PRs bricht ein neuer Push den alten Lauf ab; auf main bekommt jeder Lauf eine eigene Gruppe.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ohne Typst überspringt putzplan-pdf.test.ts genau die aussagekräftigen Tests.
      - name: Typst holen (dieselbe Fassung wie im Image)
        run: sudo sh docker/typst-holen.sh /usr/local/bin

      - run: typst --version

      - run: npm run typecheck

      - run: npm test

      - run: npm run check
