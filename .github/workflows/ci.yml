name: CI

on:
  pull_request:
  # Auf main ruft main.yml diesen Workflow auf.
  workflow_call:

concurrency:
  # In PRs bricht ein neuer Push den alten Lauf ab; auf main bekommt jeder Lauf eine eigene Gruppe.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ohne Typst überspringt putzplan-pdf.test.ts genau die aussagekräftigen Tests.
      - name: Typst holen (dieselbe Fassung wie im Image)
        run: sudo sh docker/typst-holen.sh /usr/local/bin

      - run: typst --version

      - run: npm run typecheck

      - run: npm test

      - run: npm run check
