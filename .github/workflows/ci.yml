name: CI

# Auf Push und PR. Was hier rot ist, wuerde in JEDER Klasse rot sein — deshalb
# laeuft es hier und nicht n-mal in den Klassen-Repos.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` vor den Tests: die Routentests pruefen Pfade nach `dist/`, und
      # `astro/` wird ohnehin nur ausgeliefert, wenn der Nodeteil kompiliert.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - run: npm run check
