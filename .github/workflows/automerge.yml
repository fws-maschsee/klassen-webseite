name: Automerge
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Unetikettierte Dependabot-PRs einordnen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          offen=$(gh pr list --repo "$GITHUB_REPOSITORY" --author 'app/dependabot' --state open \
            --json number,labels \
            --jq '.[] | select([.labels[].name] | any(. == "automerge" or . == "major") | not) | .number')
          for pr in $offen; do
            meta=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json title,body,headRefName,commits \
              --jq '[.title, .headRefName, .body, (.commits[]?.messageHeadline), (.commits[]?.messageBody)] | join("\n")')
            if printf '%s\n' "$meta" | grep -qE '^ *dependency-group: *majors *$|^dependabot/.+/majors-[0-9a-f]+$'; then
              label=major
            elif printf '%s\n' "$meta" | grep -qE 'update-type: *version-update:semver-major'; then
              label=major
            elif printf '%s\n' "$meta" | grep -qE '^ *dependency-group: *minor-and-patch *$|^dependabot/.+/minor-and-patch-[0-9a-f]+$'; then
              label=automerge
            elif printf '%s\n' "$meta" | grep -qE 'update-type: *version-update:semver-'; then
              label=automerge
            else
              paare=$(printf '%s\n' "$meta" \
                | grep -E '^(Bump|Bumps|Updates) ' \
                | grep -oiE 'from v?[0-9]+(\.[0-9]+)* to v?[0-9]+(\.[0-9]+)*' \
                | sed -E 's/[Ff]rom v?([0-9.]+) to v?([0-9.]+)/\1 \2/' || true)
              if [ -z "$paare" ]; then
                label=major
              elif printf '%s\n' "$paare" \
                   | awk 'NF==2 { split($1,a,"."); split($2,b,"."); if (a[1]+0 != b[1]+0) f=1 } END { exit f?0:1 }'; then
                label=major
              else
                label=automerge
              fi
            fi
            echo "PR #$pr -> $label"
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "$label" \
              || echo "PR #$pr konnte nicht etikettiert werden -- naechster Lauf versucht es erneut"
          done
      - name: Gruene `automerge`-PRs mergen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --author 'app/dependabot' --label automerge --state open --json number --jq '.[].number'); do
            state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup,mergeable \
              --jq '[.statusCheckRollup[]? | select(.name != "Automerge") | (.conclusion // .state)] as $c
                    | if ($c | length) == 0 then "green"
                      elif ($c | map(. == "SUCCESS" or . == "NEUTRAL" or . == "SKIPPED") | all) then "green"
                      elif ($c | map(. == "FAILURE" or . == "ERROR" or . == "CANCELLED" or . == "TIMED_OUT") | any) then "red"
                      else "pending" end' || echo unreadable)
            echo "PR #$pr: $state"
            [ "$state" = green ] || continue
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch || echo "PR #$pr konnte nicht gemergt werden (Konflikt? Schutzregel?)"
          done
