name: Automerge
# Ereignis statt Zeitplan. Kein natives Auto-Merge: private Repos im Free-Plan haben keine Required Checks.
on:
  workflow_run:
    # Alle Workflows, die auf PRs laufen; fehlt einer, bricht der Lauf unten laut ab.
    workflows: [Dependabot einordnen, CI, Anmeldung]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write
jobs:
  mergen:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: automerge-${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Grünen `automerge`-PR mergen
        id: mergen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --author 'app/dependabot' \
            --json number,headRefOid,labels \
            --jq ".[] | select(.headRefOid == \"$SHA\") | select([.labels[].name] | index(\"automerge\")) | .number")
          if [ -z "$pr" ]; then
            echo "Kein offener automerge-PR mit Stand $SHA auf $BRANCH"; exit 0
          fi
          ausloeser=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/automerge.yml?ref=$GITHUB_SHA" \
            | yq -o=json '.on.workflow_run.workflows')
          checks=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup --jq '.statusCheckRollup')
          fehlend=$(jq -r --argjson a "$ausloeser" \
            '[.[] | .workflowName // empty | select(. as $w | $a | index($w) | not)] | unique | join(", ")' <<<"$checks")
          if [ -n "$fehlend" ]; then
            echo "::error::PR #$pr hat Checks aus Workflows, die Automerge nicht auslösen: $fehlend — in automerge.yml unter workflow_run.workflows ergänzen"
            exit 1
          fi
          stand=$(jq -r '[.[] | (.conclusion // .state // "") | ascii_upcase] as $c
            | if ($c | map(. == "FAILURE" or . == "ERROR" or . == "CANCELLED" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "STARTUP_FAILURE") | any) then "rot"
              elif ($c | map(. == "SUCCESS" or . == "NEUTRAL" or . == "SKIPPED") | all) then "gruen"
              else "offen" end' <<<"$checks")
          echo "PR #$pr: $stand"
          [ "$stand" = gruen ] || exit 0
          # --match-head-commit: schiebt Dependabot inzwischen nach, wird nichts Ungeprüftes gemergt.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
          echo "gemergt=true" >> "$GITHUB_OUTPUT"
