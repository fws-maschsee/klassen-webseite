version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Bewusst hoch: ist das Limit ausgeschöpft, legt Dependabot auch den Sammel-PR nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Muss nach minor-and-patch stehen: eine Abhängigkeit landet in der ersten passenden Gruppe.
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
