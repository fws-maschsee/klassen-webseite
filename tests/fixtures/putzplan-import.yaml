# IMPORTS aussieht.
#
# Getrennt von `putzplan.yaml` in diesem Verzeichnis: Jene Datei ist die
# kleine, an der die Umrechnung geprueft wird, diese die vollstaendige, an der
# der Import als Ganzes haengt. Zehn Familien, zehn Termine, jede Familie
# zweimal — eine gewoehnliche Einteilung, wie eine Klasse sie eintraegt.
#
# ABSICHTLICH nicht chronologisch: der Import sortiert selbst, und ein
# nachgetragener Termin landet in der echten Datei dort, wo gerade Platz war.
#
# Die Namen sind erfunden. Eine echte Einteilung gehoert nicht in dieses
# Repository — sie nennt die Familien einer bestimmten Klasse.

