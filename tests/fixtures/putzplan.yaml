# Steht fuer `src/content/putzplan.yaml` einer Klasse.
#
# ABSICHTLICH nicht chronologisch: die Sortierung ist Aufgabe der Seite, und ein
# nachgetragener Termin landet in der echten Datei dort, wo gerade Platz war.
#
# Die Namen sind erfunden. Eine echte Einteilung gehoert nicht in dieses
# Repository — sie nennt die Familien einer bestimmten Klasse.
#
# Die Anzahl der Eintraege steht in KEINEM Test als Zahl. Die Tests zaehlen sie
# aus dieser Datei; sonst waere ein sechster Eintrag hier eine rote Zeile dort,
# und die Aussage "keine stille Auslassung" haenge an einer Zahl, die jemand
# nachzieht.

- id: "2026-09-04"
  datum: 2026-09-04
  familien:
    - name: Musterfrau
      slug: musterfrau
    - name: Beispiel
      slug: beispiel

- id: "2026-08-21"
